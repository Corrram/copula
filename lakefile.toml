name = "copula"
version = "0.1.0"
description = "Finite-dimensional copulas, dependence orders, and rank correlations in Lean 4"
keywords = ["math", "probability", "copulas", "dependence", "mathlib"]
license = "Apache-2.0"
reservoir = true
defaultTargets = ["Copula"]
testDriver = "CopulaTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Copula"

[[lean_lib]]
name = "CopulaTest"
